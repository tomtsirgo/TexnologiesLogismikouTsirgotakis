# Used by integration tests (@ActiveProfiles("test")) so that a real MySQL
# server is never required to run the test suite - H2 in-memory instead.
spring.datasource.url=jdbc:h2:mem:cinema_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# In-memory tests start from an empty schema each run; skip the file-mode
# schema.sql/data.sql bootstrap and let Hibernate build the schema from the
# entities only.
spring.sql.init.mode=never

app.token.ttl-minutes=1440

# Rate limiting is OFF by default under the test profile (ASSUMPTIONS.md #42).
# The M2-M4 regression suites legitimately fire far more than 5 submissions and
# 30 searches per minute under the same fixed usernames (alice01, bob2024, ...),
# and they are not testing the limiter. The classes that DO test it turn it back
# on explicitly with @SpringBootTest(properties = "app.rate-limit.enabled=true")
# and reset the buckets between tests, so the production numbers are still
# proven end-to-end.
app.rate-limit.enabled=false
app.rate-limit.submission-per-minute=5
app.rate-limit.search-per-minute=30

app.idempotency.ttl-hours=24
