# =========================================================================
# Cinema Management System - application-mysql.properties
# =========================================================================
# Activate with SPRING_PROFILES_ACTIVE=mysql (or --spring.profiles.active=mysql).
# Prerequisite: a running MySQL 8.x server reachable at the URL below. The
# schema/database itself is auto-created (createDatabaseIfNotExist=true) and
# tables are managed by Hibernate (ddl-auto=update) plus the bootstrap
# schema.sql/data.sql on the classpath; db/create_tables.sql at the repo root
# is the standalone hand-written equivalent DDL for manual provisioning.

spring.datasource.url=jdbc:mysql://localhost:3306/cinema_management?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

app.token.ttl-minutes=1440

logging.level.gr.aegean.cinema=INFO
