# =========================================================================
# Cinema Management System - application.properties (default profile)
# =========================================================================
# Default profile: H2 in FILE mode, so the app boots with ZERO external setup
# and data survives restarts (file lives under ./data relative to the
# working directory the app is started from).

spring.application.name=cinema-management

# --- Server ---
server.port=8080

# --- H2 file-mode datasource (default profile) ---
spring.datasource.url=jdbc:h2:file:./data/cinema;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
# ddl-auto=update lets Hibernate create/refresh the schema from the entity
# classes on top of the schema.sql/data.sql bootstrap below - convenient for
# development. The equivalent hand-written DDL (for the "SQL scripts for
# database/table generation" deliverable) lives in db/create_tables.sql at
# the repo root, and a Hibernate-shaped mirror lives in schema.sql here.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# --- SQL init (schema.sql / data.sql) ---
# ALWAYS run schema.sql/data.sql; 'continue' means a failure in one of them
# (e.g. re-running against an already-initialized file-mode database) never
# stops the app from booting.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
# Run schema.sql/data.sql AFTER Hibernate has already created/updated the
# schema from the entities, so data.sql's INSERTs target tables that are
# guaranteed to already exist.
spring.jpa.defer-datasource-initialization=true

# --- Custom application settings ---
# Bearer token lifetime (TTL), in minutes. 1440 = 24 hours (ASSUMPTIONS.md #3).
app.token.ttl-minutes=1440

# Rate limiting (in-memory token bucket, ASSUMPTIONS.md #4 / #20).
# Exceeding a bucket returns HTTP 429 with errorCode=RATE_LIMITED.
#   submission -> POST /api/screenings/{id}/submit, per authenticated user
#   search     -> GET /api/programs and GET /api/programs/{id}/screenings,
#                 per authenticated user or per client IP for an anonymous VISITOR
app.rate-limit.enabled=true
app.rate-limit.submission-per-minute=5
app.rate-limit.search-per-minute=30

# Idempotency (ASSUMPTIONS.md #15): how long a used Idempotency-Key keeps
# replaying its first successful response, in hours.
app.idempotency.ttl-hours=24

# --- Logging ---
logging.level.gr.aegean.cinema=INFO
